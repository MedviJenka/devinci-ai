name: devinci
services:

  npc_service:
    container_name: npc_service
    build:
      context: .
      dockerfile: Dockerfile
      target: npc_service
    env_file:
      - .env
    ports:
      - "5555:5555"
    volumes:
      - memory:/app/.crewai/memory
    networks:
      - app
    restart: unless-stopped

  frontend_service:
    container_name: frontend
    env_file:
      - .env
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
      target: frontend
      args:
        REACT_APP_SUPABASE_URL: ${SUPABASE_URL}
        REACT_APP_SUPABASE_ANON_KEY: ${SUPABASE_PUBLISHABLE_API_KEY}
    ports:
      - "3000:80"
    networks:
      - app
    restart: unless-stopped
    depends_on:
      - npc_service


networks:
  app:

volumes:
  memory:
