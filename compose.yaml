services:
  npc_service:
    container_name: npc_service
    build:
      context: .
      dockerfile: Dockerfile
      target: npc_service
    env_file:
      - .env
    ports:
      - "5555:5555"
    volumes:
      - memory:/app/.crewai/memory
      - ./.npcs/src/.npcs/knowledge:/app/knowledge
    networks:
      - app
    restart: unless-stopped

  frontend:
    container_name: frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: frontend
    ports:
      - "3000:80"
    networks:
      - app
    restart: unless-stopped
    depends_on:
      - npc_service


networks:
  app:

volumes:
  memory:
