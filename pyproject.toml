[project]
name = "unity-npc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.51",
    "botocore>=1.43.51",
    # Exact-pinned: core/ai/agent_runtime.py's kickoff_streaming() reaches into
    # crewai internals (enable_agent_streaming, LiteAgentOutput, StreamingOutputBase,
    # crewai.utilities.streaming) that aren't part of crewai's public API and can
    # change shape in a patch release. Bump deliberately, re-reading agent_runtime.py
    # against the new source, not via a version range.
    "crewai==1.15.4",
    "fastapi",
    "logfire",
    "pydantic-settings",
    "pygame>=2.6.1",
    "python-dotenv",
    "supabase>=2.31.0",
    "uvicorn",
]

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-playwright>=0.5",
    "pytest-xdist>=3.6",
    "filelock>=3.16",
]
