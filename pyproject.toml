[project]
name = "unity-npc"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.51",
    "botocore>=1.43.51",
    # Exact-pinned: src/core/ai/crewai_compat.py monkeypatches crewai.project.json_loader,
    # which isn't part of crewai's public API and can change shape in a patch release.
    # Bump deliberately, re-reading crewai_compat.py against the new source. crewAI only
    # backs the offline creator crews (skill_agent) - NPC /talk calls openai directly.
    "crewai==1.15.4",
    "fastapi",
    "logfire",
    "openai>=2.46",
    "pydantic-settings",
    "pygame>=2.6.1",
    "python-dotenv",
    "supabase>=2.31.0",
    "uvicorn",
]

[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-playwright>=0.5",
    "pytest-xdist>=3.6",
    "filelock>=3.16",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
