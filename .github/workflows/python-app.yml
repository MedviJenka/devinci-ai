# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: [ "main", "integration" ]
  pull_request:
    branches: [ "main", "integration" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    env:
      API_VERSION: ${{ secrets.API_VERSION }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      GOOGLE_OAUTH_CALLBACK_URI: ${{ secrets.GOOGLE_OAUTH_CALLBACK_URI }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_PUBLISHABLE_API_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_API_KEY }}
      SUPABASE_SECRET_API_KEY: ${{ secrets.SUPABASE_SECRET_API_KEY }}
      SUPABASE_UR: ${{ secrets.SUPABASE_UR }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Import .env
      run: | 
        {{ secrets. }}
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        pytest -n auto --dist loadscope
    - name: Run Docker Container
      run: |
        docker compose up -d --build || exit code 0;
        docker compose down
  
