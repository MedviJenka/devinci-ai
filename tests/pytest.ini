[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -ra
    --strict-markers
    --strict-config
    --dist=loadgroup
    --browser=chromium

markers =
    e2e: end-to-end browser test driven by Playwright against the built frontend
    smoke: fast critical-path check, good for a pre-merge gate
    regression: broader coverage beyond the golden path
    edge_case: boundary / error-path coverage
    serial: must not run concurrently with other tests (use sparingly; forces same xdist group)

; Run in parallel with: pytest -n auto
; Run serially (e.g. for debugging with --pdb, which xdist disallows): pytest -n0
